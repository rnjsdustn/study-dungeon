<body><main>

<section id="setup" class="panel">
<h2>📚 나에게 맞는 공부 선택</h2>
<label for="grade">학교급</label><select id="grade">
<option value="elementary">초등학교</option><option value="middle">중학교</option><option value="high">고등학교</option></select>
<div id="gradeNote" class="grade-note">초등학생 눈높이에 맞춘 기초 개념과 문제를 풀어요.</div>
<label for="subject">과목</label><select id="subject"><option value="mix">🎲 모든 과목 섞기</option><option value="math">수학</option><option value="science">과학</option><option value="english">영어</option><option value="korean">국어·상식</option></select>
<label for="questionCount">문제 개수 (5개 간격)</label><select id="questionCount"><option value="5">5문제</option><option value="10">10문제</option><option value="15">15문제</option><option value="20">20문제</option><option value="25">25문제</option><option value="30" selected>30문제 (전체)</option></select>
<button class="primary" id="start" style="width:100%;margin-top:18px">던전 입장하기 🚪</button>
</section>
<section id="game" class="panel hidden">
<button id="lobbyFromGame" type="button" style="background:#405578;color:white;width:100%;margin-bottom:14px">🏠 로비 화면으로 가기</button>
<div class="stats"><div>❤️ 체력<b id="hp">5/5</b></div><div>✨ 경험치<b id="xp">0</b></div><div>🏆 정답<b id="kills">0</b></div><div>⭐ 레벨<b id="level">1</b></div></div>
<div class="bar"><span id="progress"></span></div><div id="monster">👾</div><div class="small" id="count"></div>
<div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div>
<button class="primary hidden" id="next" style="width:100%">다음 문제 →</button>
</section>
<section id="result" class="panel hidden"><h2 id="resultTitle">모험 결과</h2><p id="resultText"></p><button class="primary" id="again">🏠 로비 화면으로 가기</button></section>
<p class="small">정답이면 경험치 10점! 틀려도 해설을 읽고 배울 수 있어.</p>
</main>

function start(){let g=$('grade').value,s=$('subject').value,count=Number($('questionCount').value);let pool=bank.filter(q=>q[0]===g&&(s==='mix'||q[1]===s));questions=shuffle(pool).slice(0,count);idx=0;hp=5;xp=0;kills=0;$('setup').classList.add('hidden');$('result').classList.add('hidden');$('game').classList.remove('hidden');render();}
function render(){if(idx>=questions.length||hp<=0){finish();return;}locked=false;let q=questions[idx];$('hp').textContent=hp+'/5';$('xp').textContent=xp;$('kills').textContent=kills;$('level').textContent=1+Math.floor(xp/50);$('count').textContent=(idx+1)+' / '+questions.length+' 문제 · '+({math:'수학',science:'과학',english:'영어',korean:'국어·상식'}[q[1]]);$('progress').style.width=(idx/questions.length*100)+'%';$('monster').textContent=['👾','🐲','🦇','👹'][idx%4];$('question').textContent=q[2];$('feedback').textContent='';$('next').classList.add('hidden');$('answers').innerHTML='';q[3].forEach((a,i)=>{let b=document.createElement('button');b.textContent=(i+1)+'. '+a;b.onclick=()=>choose(i);$('answers').appendChild(b);});}
function choose(n){if(locked)return;locked=true;let q=questions[idx],bs=[...$('answers').children];bs.forEach((b,i)=>{b.disabled=true;if(i===q[4])b.classList.add('correct');});if(n===q[4]){xp+=10;kills++;$('monster').textContent='💥';$('feedback').textContent='정답! +10 경험치. '+q[5];}else{hp--;$('monster').textContent='💢';bs[n].classList.add('wrong');$('feedback').textContent='아쉬워! 정답은 “'+q[3][q[4]]+'”야. '+q[5];}$('hp').textContent=hp+'/5';$('xp').textContent=xp;$('kills').textContent=kills;$('level').textContent=1+Math.floor(xp/50);$('progress').style.width=((idx+1)/questions.length*100)+'%';$('next').textContent=hp<=0?'결과 보기':'다음 문제 →';$('next').classList.remove('hidden');}
function next(){idx++;render();}
function finish(){$('game').classList.add('hidden');$('result').classList.remove('hidden');$('resultTitle').textContent=hp<=0?'모험 종료!':'던전 클리어!';$('resultText').textContent=questions.length+'문제 중 '+kills+'문제 정답! 경험치 '+xp+'점, 레벨 '+(1+Math.floor(xp/50))+'을 달성했어.';}
function lobby(){$('game').classList.add('hidden');$('result').classList.add('hidden');$('setup').classList.remove('hidden');}
function again(){lobby();}
$('start').addEventListener('click',start);$('next').addEventListener('click',next);$('again').addEventListener('click',again);$('lobbyFromGame').addEventListener('click',lobby);
</script></body></html>
